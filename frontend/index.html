<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
    <meta name="application-name" content="Mixo">
    <meta name="apple-mobile-web-app-title" content="Mixo">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#0B4F9C">
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <!--
    THESIS: Mixo turns each role's next task into a precise salon work sheet; it refuses the generic metric-card dashboard.
    OWN-WORLD: cool matte paper, cobalt index marks, fine ruled dividers, direct photography and restrained semantic color.
    STORY: the user identifies their role, sees the current state, acts, then reaches the next destination without training.
    FIRST VIEWPORT: compact Mixo app bar, task-led heading, dominant priority action, concise secondary rows and thumb navigation.
    FORM: action-priority composition, selected first among three probes; seed bae920a2.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div class="mixo-route-progress" aria-hidden="true"></div>
    <div class="mixo-boot" id="mixo-boot" role="status" aria-live="polite">
        <div class="mixo-boot__content">
            <span class="mixo-boot__mark" aria-hidden="true">M</span>
            <div><strong>Mixo</strong><span>Préparation de votre espace…</span></div>
        </div>
    </div>
    <div id="app"></div>
    
    <script type="module" src="/src/main.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.475.0/dist/umd/lucide.min.js"></script>
    <script>
      // Callback par défaut pour éviter une erreur si l'API reCAPTCHA charge
      // avant que la page d'inscription n'enregistre son vrai handler.
      window.onRecaptchaApiLoad = window.onRecaptchaApiLoad || function () {};
    </script>
    <script src="https://www.google.com/recaptcha/api.js?render=explicit&onload=onRecaptchaApiLoad" async defer></script>
    
    <script>
      // Cette fonction active les icônes globales au chargement initial
      window.onload = () => {
        if (window.lucide) {
            lucide.createIcons();
        }
      };
    </script>
</body>
</html>
