services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mixo}
      POSTGRES_USER: ${POSTGRES_USER:-mixo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans Dokploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Définissez SECRET_KEY dans Dokploy}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Définissez ALLOWED_HOSTS dans Dokploy}
      FRONTEND_URL: ${FRONTEND_URL:?Définissez FRONTEND_URL dans Dokploy}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${FRONTEND_URL}}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-${FRONTEND_URL}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mixo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mixo}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Définissez CLOUDINARY_CLOUD_NAME dans Dokploy}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Définissez CLOUDINARY_API_KEY dans Dokploy}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Définissez CLOUDINARY_API_SECRET dans Dokploy}
      FIREBASE_ADMIN_CREDENTIALS_PATH: /run/secrets/firebase-adminsdk.json
      FIREBASE_ADMIN_CREDENTIALS_JSON: ${FIREBASE_ADMIN_CREDENTIALS_JSON:?Définissez FIREBASE_ADMIN_CREDENTIALS_JSON dans Dokploy}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: /api/
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Définissez VITE_FIREBASE_API_KEY dans Dokploy}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Définissez VITE_FIREBASE_AUTH_DOMAIN dans Dokploy}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Définissez VITE_FIREBASE_PROJECT_ID dans Dokploy}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?Définissez VITE_FIREBASE_STORAGE_BUCKET dans Dokploy}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?Définissez VITE_FIREBASE_MESSAGING_SENDER_ID dans Dokploy}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Définissez VITE_FIREBASE_APP_ID dans Dokploy}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:?Définissez VITE_RECAPTCHA_SITE_KEY dans Dokploy}
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - django_static:/var/www/static:ro
      - django_media:/var/www/media:ro

volumes:
  postgres_data:
  django_static:
  django_media:
